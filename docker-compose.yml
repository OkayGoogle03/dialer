# Local dependencies. The database is TiDB Cloud (see .env.example); no local database container.
# Telephony (Asterisk/Kamailio) is added in Phase 2.
name: project-dialer
services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: [natsdata:/data]

volumes:
  natsdata:
