<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Project Dialer - Server</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{--bg:#e9e2d7;--surface:#f7f1e9;--surface2:#fff9f1;--text:#292521;--muted:#898078;--accent:#e98b35;--danger:#d96a63;--sc:94,74,50}
@media (prefers-color-scheme:dark){:root{--bg:#1c1713;--surface:#2a231d;--surface2:#332b24;--text:#f1e9de;--muted:#a89c8f;--sc:0,0,0}}
*{box-sizing:border-box}
body{font:14px 'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;color:var(--text);background:radial-gradient(1200px 700px at 10% -10%,var(--surface),transparent 60%),var(--bg)}
.card{width:100%;max-width:420px;padding:28px;border-radius:22px;background:linear-gradient(160deg,var(--surface2),var(--surface) 55%);box-shadow:10px 12px 26px rgba(var(--sc),.16),-8px -8px 20px rgba(255,255,255,.6),inset 0 1px 0 rgba(255,255,255,.8)}
h2{margin:0 0 8px;font-size:22px;letter-spacing:-.01em}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 16px}
input{font:inherit;width:100%;padding:11px 14px;border-radius:12px;border:1px solid transparent;color:var(--text);background:color-mix(in srgb,var(--bg) 70%,var(--surface));box-shadow:inset 3px 4px 8px rgba(var(--sc),.17),inset -3px -3px 8px rgba(255,255,255,.55)}
input:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:2px}
button{font:inherit;font-weight:600;margin-top:14px;width:100%;padding:10px 18px;border:0;border-radius:999px;cursor:pointer;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.18);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent) 55%,color-mix(in srgb,var(--accent) 85%,#000));box-shadow:0 6px 14px color-mix(in srgb,var(--accent) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .16s,box-shadow .16s}
button:hover{transform:translateY(-1px)}button:active{transform:translateY(1px) scale(.98)}
.err{color:var(--danger);margin-top:10px}
</style></head>
<body><main class="card"><h2>Project Dialer</h2>
<p class="hint">Enter the address of your Dialer server (the same address you use in the browser).</p>
<form id="f"><input id="s" placeholder="https://dialer.example.com" autofocus autocomplete="off" aria-label="Server address"><button>Connect</button></form>
<div id="e" class="err" role="alert"></div></main>
<script>
const q = new URLSearchParams(location.search); if (q.get('error')) document.getElementById('e').textContent = q.get('error');
window.desktop.getServer().then(v => { if (v) document.getElementById('s').value = v; });
document.getElementById('f').addEventListener('submit', async (ev) => { ev.preventDefault(); const r = await window.desktop.setServer(document.getElementById('s').value); if (!r.ok) document.getElementById('e').textContent = r.message; });
</script></body></html>
